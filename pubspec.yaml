name: voltar
description: "VoltAR — aplikasi pembelajaran elektronika (Arduino/ESP) untuk siswa SMK."
publish_to: 'none'

# version: <build-name>+<build-number>
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_svg: ^2.3.0
  avr8_dart: ^0.1.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fase 2: ikon Lucide 24x24 (ISC). Lisensi: assets/licenses/ISC-Lucide.txt
  # Fase 1 & 2: data materi JSON
  assets:
    - assets/icons/
    - assets/hex/
    - assets/data/
    - assets/images/materi/level_1/pengenalan komponen/Breadboard/
    - assets/images/materi/level_1/pengenalan komponen/Kapasitor/
    - assets/images/materi/level_1/pengenalan komponen/Led/
    - assets/images/materi/level_1/pengenalan komponen/push button tacticle/
    - assets/images/materi/level_1/pengenalan komponen/resistor/
    - assets/images/materi/level_2/array_pointer/
    - assets/images/materi/level_2/input_output/
    - assets/images/materi/level_2/operator_percabangan/
    - assets/images/materi/level_2/relay/
    - assets/images/materi/level_2/struktur_sketch/
    - assets/images/materi/level_3/ADC/
    - assets/images/materi/level_3/jenis_prinsip_kerja_sensor/
    - assets/images/materi/level_3/PWM/
    - assets/images/materi/level_4/debouncing/
    - assets/images/materi/level_4/interrupt/
    - assets/images/materi/level_4/jenis_motor/
    - assets/images/materi/level_4/milis/

  # Fase 0: font dibundel (offline-first, tanpa google_fonts runtime fetch).
  # Lisensi: assets/licenses/OFL-PlusJakartaSans.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
